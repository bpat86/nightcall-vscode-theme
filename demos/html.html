<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Modern HTML syntax demonstration" />
    <title>Theme preview</title>
  </head>

  <body>
    <header>
      <nav aria-label="Primary navigation">
        <a href="/">Nightcall</a>
      </nav>
    </header>

    <main id="app">
      <article data-theme="nightcall">
        <h1>Theme preview</h1>
        <p data-quote>Loading a quote&hellip;</p>
        <button type="button" commandfor="details" command="show-modal">
          Open details
        </button>
      </article>
    </main>

    <dialog id="details">
      <form method="dialog">
        <p>Semantic HTML uses meaningful elements and native controls.</p>
        <button>Close</button>
      </form>
    </dialog>

    <script type="module" src="./js.js"></script>
  </body>
</html>
